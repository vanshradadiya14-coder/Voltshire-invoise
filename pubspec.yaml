name: builder_crm
description: Professional CRM & Invoice app for a UK building company.
publish_to: "none"

# App version. Bump build number (after +) on each store release.
version: 2.0.0+2

# Uses recent Flutter APIs (Color.withValues, CardThemeData), so a current
# stable Flutter (3.32+) is required.
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- State management ----
  flutter_riverpod: ^2.5.1

  # ---- Firebase ----
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # ---- Subscriptions / billing ----
  # RevenueCat handles receipt validation, entitlements, trials and restore
  # across both stores. Wrapped behind BillingService so tests never touch it.
  purchases_flutter: ^8.1.6

  # ---- Routing ----
  go_router: ^14.2.7

  # ---- Charts ----
  fl_chart: ^0.69.0

  # ---- PDF & printing ----
  pdf: ^3.11.1
  printing: ^5.13.3

  # ---- Sharing ----
  share_plus: ^10.0.2

  # ---- Media / files ----
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4

  # ---- Security ----
  local_auth: ^2.3.0

  # ---- Connectivity (offline write-queue banner) ----
  connectivity_plus: ^6.0.5

  # ---- Data export ----
  csv: ^6.0.0

  # ---- Utilities ----
  intl: ^0.20.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  collection: ^1.18.0
  package_info_plus: ^8.0.2

  # Material icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # App assets. images/ holds the brand logo used by the icon generator, the
  # splash screen and the PDF header fallback.
  assets:
    - assets/images/

  # To bundle a custom font (so PDF output is byte-identical across devices),
  # drop the .ttf files into assets/fonts/, then uncomment and adjust the block
  # below and set `fontFamily: 'AppFont'` in lib/theme/app_theme.dart.
  #
  # fonts:
  #   - family: AppFont
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700

# ---------------------------------------------------------------------------
# App icon generation.  Run:  dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  # Adaptive icon: the mark sits on a white plate so it reads on any wallpaper.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#1A4FD1"

# ---------------------------------------------------------------------------
# Native splash generation.  Run:  dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_logo.png"
  color_dark: "#0E1116"
  image_dark: "assets/images/splash_logo.png"
  android_12:
    image: "assets/images/splash_logo.png"
    color: "#FFFFFF"
    color_dark: "#0E1116"
  android: true
  ios: true
  web: false
