name: CI

# Runs on pull requests, manual dispatch, and as a required step inside
# build-apk.yml (via workflow_call) so a broken analyze or a failing test
# never produces an APK that looks shippable.
#
# Deliberately NOT triggered by `push` to main/master: build-apk.yml already
# calls this workflow first thing on every such push. Triggering it directly
# as well ran it twice per push - once as a standalone "CI" run showing only
# the coverage artifact (confusing on its own, with no APK in sight), and
# again inside the real "Build Android APK" run a few seconds later.
on:
  pull_request:
  workflow_dispatch: {}
  # Lets the APK workflow depend on this one.
  workflow_call: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # Non-blocking: a formatting nit should not stop a release, but it
        # should be visible in the log.
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
