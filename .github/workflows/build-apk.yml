name: Build Android APK

# Builds a release APK in the cloud on every push, and lets you trigger a
# build manually from the Actions tab. No local Flutter install needed.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  # Gate the build on analyze + tests, so a green artifact always means a
  # green codebase.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java (needed by the Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project files
        run: flutter create --platforms=android .

      - name: Set Android SDK versions (Firebase minSdk 23; force compileSdk 36 everywhere)
        run: |
          app=android/app/build.gradle.kts
          if [ -f "$app" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$app"
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$app"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$app"
          fi
          # Force EVERY Android module (app + all plugins) to compile against
          # SDK 36. Some plugins hardcode an older compileSdk, so an app-level
          # bump alone is not enough.
          proj=android/build.gradle.kts
          if [ -f "$proj" ]; then
            {
              echo ""
              echo "subprojects {"
              echo "    if (!state.executed) {"
              echo "        afterEvaluate {"
              echo "            val androidExtension = project.extensions.findByName(\"android\")"
              echo "            if (androidExtension is com.android.build.gradle.BaseExtension) {"
              echo "                androidExtension.compileSdkVersion(36)"
              echo "            }"
              echo "        }"
              echo "    }"
              echo "}"
            } >> "$proj"
          fi
          echo "----- app build.gradle.kts Sdk lines -----"
          grep -E 'Sdk' "$app" || true
          echo "----- project build.gradle.kts tail -----"
          tail -12 "$proj" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable biometrics (local_auth needs FlutterFragmentActivity)
        run: |
          # local_auth's Android implementation shows its prompt from a
          # FragmentActivity. The default template extends FlutterActivity, and
          # leaving it produces a runtime crash the moment app lock is used —
          # not a build error, so it is easy to ship broken.
          act=$(find android/app/src/main -name 'MainActivity.kt' | head -1)
          if [ -n "$act" ]; then
            sed -i 's/io.flutter.embedding.android.FlutterActivity/io.flutter.embedding.android.FlutterFragmentActivity/' "$act"
            sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$act"
            echo "----- MainActivity.kt -----"; cat "$act"
          fi

          man=android/app/src/main/AndroidManifest.xml
          if [ -f "$man" ] && ! grep -q USE_BIOMETRIC "$man"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$man"
          fi

      - name: Generate launcher icon and splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build the release APK
        # RevenueCat's public SDK key is safe in a client binary (it can only
        # read offerings and start purchases). Set REVENUECAT_ANDROID_KEY as a
        # repository secret; if it is absent the app falls back to the mock
        # billing service and everyone gets the Free tier — it never crashes.
        run: |
          flutter build apk --release \
            --dart-define=REVENUECAT_ANDROID_KEY="${{ secrets.REVENUECAT_ANDROID_KEY }}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: builder-crm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
