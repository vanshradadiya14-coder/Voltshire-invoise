name: Build Android APK

# Builds a release APK in the cloud on every push, and lets you trigger a
# build manually from the Actions tab. No local Flutter install needed.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  # Gate the build on analyze + tests, so a green artifact always means a
  # green codebase.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java (needed by the Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ is committed and already carries everything below: compileSdk
      # 36 for the app and every plugin module, a FlutterFragmentActivity for
      # local_auth, and the manifest permissions. These steps only fill gaps if
      # the folder is ever regenerated from scratch, so each one checks first —
      # re-applying them blindly appended a duplicate subprojects block and
      # forced minSdk below the version the project is actually verified on.
      - name: Restore the Android project if it is missing
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Ensure Android SDK levels
        run: |
          app=android/app/build.gradle.kts
          proj=android/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$app"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$app"
          # Some plugins pin an older compileSdk, so the app-level bump alone is
          # not enough. Added only when absent. Built with echo, one line per
          # call, rather than a heredoc: a heredoc body sits at column 0, which
          # is less indented than this block scalar's own indentation - YAML
          # then reads the block as ending right there and the workflow fails
          # to parse at all, before anything runs.
          if ! grep -q 'compileSdkVersion(36)' "$proj"; then
            {
              echo ""
              echo "subprojects {"
              echo "    if (!state.executed) {"
              echo "        afterEvaluate {"
              echo "            val androidExtension = project.extensions.findByName(\"android\")"
              echo "            if (androidExtension is com.android.build.gradle.BaseExtension) {"
              echo "                androidExtension.compileSdkVersion(36)"
              echo "            }"
              echo "        }"
              echo "    }"
              echo "}"
            } >> "$proj"
          fi
          grep -E 'Sdk' "$app" || true

      - name: Ensure biometrics prerequisites
        run: |
          # local_auth shows its prompt from a FragmentActivity; the default
          # template extends FlutterActivity, which crashes at runtime rather
          # than failing the build.
          act=$(find android/app/src/main -name 'MainActivity.kt' | head -1)
          if [ -n "$act" ]; then
            sed -i 's/io.flutter.embedding.android.FlutterActivity/io.flutter.embedding.android.FlutterFragmentActivity/' "$act"
            sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$act"
          fi
          man=android/app/src/main/AndroidManifest.xml
          if [ -f "$man" ]; then
            # sed's insert command takes the text literally to end of line, so
            # this needs no embedded newlines. A multi-line s### replacement
            # here was not valid sed and would have failed if it ever ran.
            for perm in USE_BIOMETRIC INTERNET CAMERA ACCESS_NETWORK_STATE; do
              if ! grep -q "android.permission.$perm" "$man"; then
                sed -i "/<application/i\    <uses-permission android:name=\"android.permission.$perm\"/>" "$man"
              fi
            done
            grep -E 'uses-permission' "$man" || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon and splash screen (Android only)
        run: |
          # ios/ in this repo is a partial scaffold (no AppIcon.appiconset, no
          # Xcode project) - it exists only so lib/firebase/firebase_options.dart
          # and GoogleService-Info.plist are ready for whenever a full iOS build
          # is set up on a Mac. pubspec.yaml's icon/splash config targets iOS and
          # web too, which fails here: flutter_launcher_icons tried to overwrite
          # an iOS icon file that does not exist and the whole step exit-255'd.
          # This build only needs Android, so ios/web generation is turned off
          # for this run alone, on a working copy - the committed pubspec.yaml
          # is untouched, so `dart run flutter_launcher_icons` still does the
          # full set locally once a real iOS scaffold exists.
          cp pubspec.yaml pubspec.yaml.bak
          sed -i 's/^  ios: true/  ios: false/' pubspec.yaml
          sed -i 's/^    generate: true/    generate: false/' pubspec.yaml
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          mv pubspec.yaml.bak pubspec.yaml

      - name: Build the release APK
        # RevenueCat's public SDK key is safe in a client binary (it can only
        # read offerings and start purchases). Set REVENUECAT_ANDROID_KEY as a
        # repository secret; if it is absent the app falls back to the mock
        # billing service and everyone gets the Free tier — it never crashes.
        run: |
          flutter build apk --release \
            --dart-define=REVENUECAT_ANDROID_KEY="${{ secrets.REVENUECAT_ANDROID_KEY }}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: builder-crm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
